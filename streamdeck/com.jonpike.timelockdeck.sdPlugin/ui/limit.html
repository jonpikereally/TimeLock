<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div id="problem" class="problem" style="display:none"></div>
<div class="row"><label>Limit</label><select name="limit" data-list="limits"><option value="">Loading…</option></select></div>
<div class="row"><label>Show</label><select name="show" data-default="left"><option value="left">Time left</option><option value="used">Time used</option></select></div>
<div class="row"><label>Time format</label><select name="format" data-default="auto">
  <option value="auto">Automatic</option><option value="hm">1h 05m</option><option value="hms">1:05:23</option>
  <option value="min">65 min</option><option value="dec">1.1 h</option></select></div>
<p class="hint">Limits come from the TimeLock browser extension (⚙︎ Settings in its popup). App time counts too when TimeLock for Mac is running. Press the key (or the dial) to switch between left and used; on a Stream Deck +, turn the dial to step through your limits.</p>
<p class="status" id="status"></p>
<script src="pi.js"></script></body></html>
