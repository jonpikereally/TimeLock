<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div id="problem" class="problem" style="display:none"></div>
<div class="row"><label>Kind</label><select name="kind" data-default="app"><option value="app">Mac app</option><option value="site">Website</option></select></div>
<div class="row" data-show-when="kind=app"><label>App</label><select name="name" data-list="apps" data-cycle="All apps today (cycle)"><option value="">Loading…</option></select></div>
<div class="row" data-show-when="kind=site"><label>Website</label><select name="name" data-list="sites" data-cycle="All websites today (cycle)"><option value="">Loading…</option></select></div>
<div class="row" data-show-when="name=*"><label>Show each for</label><select name="cycleSecs" data-default="5">
  <option value="2">2 seconds</option><option value="3">3 seconds</option><option value="5">5 seconds</option>
  <option value="10">10 seconds</option><option value="20">20 seconds</option></select></div>
<div class="row"><label>Time format</label><select name="format" data-default="auto">
  <option value="auto">Automatic</option><option value="hm">1h 05m</option><option value="hms">1:05:23</option>
  <option value="min">65 min</option><option value="dec">1.1 h</option></select></div>
<p class="hint">Today's time in one app or on one website (subdomains included). The lists show what's been used today; the key turns green while the app is the one being counted. Pick "All … today (cycle)" to step through everything used today, most time first; press the key to skip to the next.</p>
<p class="status" id="status"></p>
<script src="pi.js"></script></body></html>
