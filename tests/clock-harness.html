<!doctype html>
<!-- Shows the countdown clock from src/content.js on a fake page.
     Serve the repo root and open /tests/clock-harness.html?left=330 (seconds left),
     or ?unlocked=600 to see the green unlocked state. -->
<html><head><meta charset="utf-8"><title>TimeLock clock harness</title>
<style>body{margin:0;font:15px sans-serif;background:#fafafa}header{background:#ff0000;color:#fff;padding:14px 20px;font-weight:700}main{padding:20px;max-width:700px}</style></head>
<body><header>Pretend video site</header><main><p>Some page content. The clock should sit in the top-right corner, tick every second, and fade when the mouse comes near.</p></main>
<script>
const q = new URLSearchParams(location.search);
const now = Date.now();
window.chrome = { runtime: { sendMessage: async (m) => m.type === "pageStatus"
  ? { ok: true, result: { name: "Video", domains: ["youtube.com"], left: Number(q.get("left") ?? 1834), used: 1766, limit: 3600,
      unlockedUntil: q.has("unlocked") ? now + Number(q.get("unlocked")) * 1000 : 0 } }
  : { ok: true } } };
</script>
<script src="/src/content.js"></script>
</body></html>
